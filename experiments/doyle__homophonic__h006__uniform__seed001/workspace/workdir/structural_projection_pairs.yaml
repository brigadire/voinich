    max_distance: 20
    min_reliability: 0.7
    min_structural_similarity: 0.65
    projection_k: 0
    projection_mode: both
    random_projections: 200
    seed: 130013
    structural_pairs: workdir/soft_structural_pairs.tsv
    token_level_source: workdir/distance_context_pairs.yaml
methodology:
    ablated_future_weight: reliability-weighted mean(position_similarity, left_similarity), multiplied by mean component reliability; right-context component excluded
    ablated_past_weight: reliability-weighted mean(position_similarity, right_similarity), multiplied by mean component reliability; left-context component excluded
    family_projection: 'control only: family ID categories plus singleton categories for every token outside a family'
    full_weight: raw_similarity * evidence_strength; edges below either configured threshold are zero
    generic_smoothing: uniform smoothing to the same number of random tokens in the source token's log2 frequency bin
    normalization: W(X,X)=1; every retained row is divided by its row sum; projected(Y)=sum_X P(X)*normalized_W(X,Y)
    random_space: destination permutation within log2 frequency bins preserves row degree and weights approximately frequency-matched
    sequence_kernel: arithmetic mean of position-wise projected-distribution JS similarities
