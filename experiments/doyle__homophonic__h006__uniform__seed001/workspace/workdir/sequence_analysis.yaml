parameters:
    min_n: 2
    max_n: 8
    min_count: 2
    max_items: 200
    context_limit: 10
    max_context_length: 7
    context_min_observations: 10
    context_max_items: 200
methodology:
    sequence_boundary: each non-empty input line is an independent sequence; n-grams never cross line boundaries
    tokenization: Go strings.Fields; token case, punctuation, and content are preserved
    count: total number of overlapping occurrences
    line_count: number of distinct non-empty input lines containing the sequence
    entropy: 'Shannon entropy in bits: -sum(p * log2(p)), calculated from all observed contexts'
    normalized_entropy: entropy/log2(unique contexts) when unique contexts > 1; otherwise 0
    predictability: 1-normalized_entropy; equals 1 when exactly one context is observed
    maximal_repeated_sequence: a sequence with count >= min_count for which no identical left or right extension of length <= max_n preserves its full count
    coordinates: line is the 1-based physical input-file line; token_offset is 0-based within strings.Fields(line)
    output_limits: min_count and max_items filter output records per n; ngram_summary always uses all observed n-grams
    cross_line: repeated means count >= 2; cross-line repeated additionally requires occurrences in at least two distinct physical input lines
    conditional_entropy: H(next|context length k) is the context-count-weighted mean of each observed next-token distribution entropy
    context_coverage: a singleton context has one observed continuation; repeated_context_coverage is observations belonging to contexts with count >= 2 divided by all observations
    entropy_delta: entropy at context length k-1 minus entropy at k; a positive value is a diagnostic reduction in uncertainty
    interpretation: entropy can fall because contexts become sparse; all metrics are formal sequence statistics and have no semantic interpretation
