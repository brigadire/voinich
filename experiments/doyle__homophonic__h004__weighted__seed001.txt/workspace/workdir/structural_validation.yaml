methodology:
    split_unit: line
    split: line indexes are deterministically shuffled with math/rand using fold_seed, assigned round-robin to folds, then restored to source order; a line is never split
    training: each fold recomputes dictionary counts, all position observations, full predecessor/successor counts, pair similarities, and complete-link classes from TRAIN lines only; full-corpus structural_analysis.yaml is not read
    eligibility: TRAIN token count >= min_token_count; TEST counts never affect eligibility or candidate generation
    clustering: deterministic agglomerative complete-link using the arithmetic mean of TRAIN-only position similarity (1-JSD) and left/right cosine similarities; every pair must be present and >= threshold
    test_application: fixed TRAIN multi-member mappings are applied to TEST; unknown and singleton tokens retain their surface form; TEST never changes a class
    sequence_boundary: each TEST physical line is independent; n-grams and contexts never cross line boundaries
    cross_line_repeated: a unique n-gram with at least two occurrences in at least two distinct TEST lines
    conditional_entropy: H(next|context) is weighted by TEST context occurrences; entropy_delta is raw minus normalized; repeated contexts have at least two observations
    random_matching: for each fold, TRAIN-derived class sizes are retained and TRAIN-eligible tokens are sampled without replacement from base-2 TRAIN-frequency bins with nearest-bin fallback; mappings are then frozen and applied to TEST
    random_seed_derivation: normalization.RandomModel receives random_seed + fold*10000000000; its deterministic derivation additionally includes threshold and run_number
    empirical_tests: 'upper tail with +1 correction: random >= structural for counts, maximum length, coverage delta, and entropy reduction (raw entropy - normalized entropy)'
    class_stability: reported pairs are the union of pairs co-clustered in at least one TRAIN fold; folds where either TRAIN token is ineligible are excluded from the denominator
    pooled_test: sum of independent fold-level TEST counts; TEST corpora are not recombined and no cross-fold sequences are searched
    threshold_selection: 0.70 is fixed before validation from the prior full-corpus experiment and is not tuned on folds
