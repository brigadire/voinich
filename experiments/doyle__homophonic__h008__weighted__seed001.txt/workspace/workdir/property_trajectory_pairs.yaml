parameters:
    max_distance: 20
    min_token_frequency: 10
    random_pairs: 1000
    rare_token_policy: exclude from exact-distance aggregation and report excluded counts
    seed: 140014
    top: 28
methodology:
    distance: rightward exact distance in the linear corpus; shuffled controls preserve global counts
    identity: subsequent token identities are retained for lookup only; trajectories aggregate intrinsic properties without projection or smoothing
    interpretation: formal diagnostic only; no semantic, grammatical, morphological, page, or latent-state claims
    normalization: heavy-tailed count/degree/unique/effective-count properties use log1p before one global eligible-token z-score; raw and normalized values are both retained
property_groups:
    context:
        - predecessor_entropy
        - successor_entropy
        - effective_predecessor_count
        - effective_successor_count
        - unique_predecessor_count
        - unique_successor_count
        - max_predecessor_probability
        - max_successor_probability
        - top3_predecessor_mass
        - top3_successor_mass
        - top5_predecessor_mass
        - top5_successor_mass
    frequency:
        - global_count
        - log_global_count
        - global_frequency_probability
        - frequency_rank
        - normalized_frequency_rank
    graphemic:
        - grapheme_length
        - unique_grapheme_count
    position:
        - line_start_probability
        - line_end_probability
        - mean_position
        - median_position
        - normalized_mean_position
        - positional_entropy
        - positional_specialization
    structural:
        - mean_structural_similarity_to_all
        - max_structural_similarity
        - structural_degree_above_0_5
        - structural_degree_above_0_6
        - structural_degree_above_0_7
