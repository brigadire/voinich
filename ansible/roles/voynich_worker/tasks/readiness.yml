---
# Task35 phase 8: verify more than process existence: process alive, mTLS
# handshake succeeds, and the coordinator recognizes this specific worker
# credential.
#
# Task42 changes what a *failed* coordinator probe means. Task35 assumed a
# worker's whole lifecycle was one coordinator run, so "the coordinator did
# not answer" could only mean deployment itself was broken. A Task42
# persistent worker is deployed once and is *expected* to sit idle, still
# retrying with bounded backoff, for stretches with no coordinator running
# at all (before the first experiment, between experiments, or while one is
# being prepared) - see REMOTE_WORKER_LIFECYCLE.md. Failing deployment for
# that would defeat the entire point of decoupling deploy from experiment
# lifecycle. So this task now distinguishes:
#   - process never started                          -> still fatal
#   - coordinator merely unreachable/timed out        -> warn, not fatal
#   - a real mTLS/certificate identity failure        -> still fatal
#     (curl exit 35/51/58/60: SSL connect/certificate problems - the same
#     class of failure internal/conditionalregime/remote.go's
#     isPermanentWorkerError treats as permanent, not retried forever)

- name: readiness - verify the managed process is alive
  ansible.builtin.include_tasks: is_running.yml

- name: readiness - fail fast if the process never came up
  ansible.builtin.fail:
    msg: >-
      voynich_worker: managed process is not running on
      {{ inventory_hostname }} after start - check
      {{ voynich_worker_log_dir }}/worker.log on that host.
  when: not voynich_worker_is_running

- name: readiness - verify curl is available for the mTLS probe
  ansible.builtin.command: curl --version
  changed_when: false
  failed_when: false
  register: voynich_worker_curl_check

- name: readiness - fail if curl is missing
  ansible.builtin.fail:
    msg: >-
      curl is required on the worker host to verify mTLS readiness
      (Task35 phase 8); install it or provide an alternative probe.
  when: voynich_worker_curl_check.rc != 0

# GET /v1/handshake with this host's own installed credentials exercises
# exactly the same mTLS + protocol path the real worker process uses at
# its own startup handshake (internal/conditionalregime/remote.go): a
# revoked, foreign-CA, wrong-EKU or otherwise rejected certificate fails
# here the same way it would fail for the worker itself, so a 200 is
# proof the coordinator authenticated and recognized this specific
# worker identity - not merely that some TCP port answered.
- name: readiness - probe the coordinator with this worker's own mTLS credentials
  ansible.builtin.command:
    cmd: >-
      curl -sS -o /dev/null -w '%{http_code}'
      --connect-timeout {{ voynich_worker_readiness_probe_timeout_seconds }}
      --max-time {{ voynich_worker_readiness_probe_timeout_seconds }}
      --cacert {{ (voynich_worker_install_dir ~ '/pki/ca.crt') | quote }}
      --cert {{ (voynich_worker_install_dir ~ '/pki/worker.crt') | quote }}
      --key {{ (voynich_worker_install_dir ~ '/pki/worker.key') | quote }}
      {{ (voynich_worker_coordinator_url ~ '/v1/handshake') | quote }}
  register: voynich_worker_handshake_probe
  changed_when: false
  failed_when: false
  until: (voynich_worker_handshake_probe.stdout | default('')) == '200'
  retries: "{{ ((voynich_worker_readiness_timeout_seconds | float) / (voynich_worker_readiness_poll_interval_seconds | float)) | round(0, 'ceil') | int }}"
  delay: "{{ voynich_worker_readiness_poll_interval_seconds }}"

- name: readiness - classify a failed probe as a permanent identity failure or a merely-unreachable coordinator
  ansible.builtin.set_fact:
    voynich_worker_probe_permanent_failure: "{{ (voynich_worker_handshake_probe.rc | default(0)) in [35, 51, 58, 60] }}"
  when: (voynich_worker_handshake_probe.stdout | default('')) != '200'

- name: readiness - fail deployment on a permanent mTLS/certificate identity failure
  ansible.builtin.fail:
    msg: >-
      voynich_worker: mTLS probe against
      {{ voynich_worker_coordinator_url }}/v1/handshake failed with a
      certificate/identity error (curl exit {{ voynich_worker_handshake_probe.rc }}),
      not a mere connectivity gap. This will not resolve itself the way a
      coordinator that simply is not running yet would - check the CA,
      this host's certificate, and the coordinator's -client-ca deny list.
  when: >-
    (voynich_worker_handshake_probe.stdout | default('')) != '200'
    and voynich_worker_probe_permanent_failure | default(false)

- name: readiness - warn (do not fail) when the coordinator is merely not reachable yet
  ansible.builtin.debug:
    msg: >-
      voynich_worker: mTLS probe against
      {{ voynich_worker_coordinator_url }}/v1/handshake did not return 200
      within {{ voynich_worker_readiness_timeout_seconds }}s (last status:
      {{ voynich_worker_handshake_probe.stdout | default('none') }}, curl
      exit {{ voynich_worker_handshake_probe.rc | default('?') }}). The
      worker process is running and will keep retrying with bounded
      backoff in the background (see {{ voynich_worker_log_dir }}/worker.log)
      until a coordinator appears - this is expected when deploying workers
      before starting the first experiment, or between experiments. Use
      `voynich_worker_state: status` later to confirm it has connected.
  when: >-
    (voynich_worker_handshake_probe.stdout | default('')) != '200'
    and not (voynich_worker_probe_permanent_failure | default(false))
