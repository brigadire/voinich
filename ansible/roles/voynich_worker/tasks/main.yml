---
# Task35: entry point. Dispatches to present.yml/absent.yml after the
# preflight checks that apply to both states.

- name: Assert required variables are set
  ansible.builtin.assert:
    that:
      - voynich_worker_state in ['present', 'absent']
      - voynich_worker_install_dir | length > 0
      - voynich_worker_install_dir is match('^/tmp/')
    fail_msg: >-
      voynich_worker_state must be 'present' or 'absent', and
      voynich_worker_install_dir must be a non-empty path under /tmp
      (Task35 constraint: payload under /tmp by default; if you must
      relocate it, keep it out of any path this role's absent-state
      cleanup could confuse with something unmanaged).

- name: Assert coordinator URL uses HTTPS (phase 12 - no silent unauthenticated fallback)
  ansible.builtin.assert:
    that:
      - voynich_worker_coordinator_url is match('^https://')
    fail_msg: >-
      voynich_worker_coordinator_url must be an https:// URL. The Task34
      worker never supports plaintext HTTP or -insecure-skip-verify, and
      this role will not silently degrade that guarantee.
  when: voynich_worker_state == 'present'

- name: Include present-state tasks
  ansible.builtin.include_tasks: present.yml
  when: voynich_worker_state == 'present'

- name: Include absent-state tasks
  ansible.builtin.include_tasks: absent.yml
  when: voynich_worker_state == 'absent'
