---
# Task35 phases 6/13: a changed binary, certificate, key, or start script
# triggers exactly one controlled stop-then-start, never a partial state.
# Both entries listen for the same notification and run in this order.

- name: restart voynich worker (stop)
  ansible.builtin.include_tasks: stop.yml
  listen: "restart voynich worker"

- name: restart voynich worker (start)
  ansible.builtin.include_tasks: start.yml
  listen: "restart voynich worker"

- name: restart frozen G1-v2 worker slots
  become: true
  ansible.builtin.systemd_service:
    name: "{{ voynich_g1v2_service_name }}@{{ item }}.service"
    state: restarted
    daemon_reload: true
  loop: "{{ range(1, (voynich_g1v2_concurrency | int) + 1) | list }}"
  listen: "restart g1v2 workers"
  when: not ansible_check_mode and ansible_service_mgr == 'systemd'

- name: restart frozen G1-v2 OpenRC worker slots
  become: true
  ansible.builtin.service:
    name: "{{ voynich_g1v2_service_name }}-{{ item }}"
    state: restarted
    enabled: true
  loop: "{{ range(1, (voynich_g1v2_concurrency | int) + 1) | list }}"
  listen: "restart g1v2 workers"
  when: not ansible_check_mode and ansible_service_mgr == 'openrc'
